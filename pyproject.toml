[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "linux-iso"
version = "0.2.9"
description = "Linux ISO - Suret: capture, rebuild and install a personalized Linux desktop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]
license = {text = "MIT"}
authors = [{name = "Taha project"}]

[project.scripts]
linux-iso = "linux_iso.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.uv]
package = true
default-groups = ["dev"]
